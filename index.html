<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado | 403</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 50%, #29004d 0%, #110022 50%, #05000a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(20, 0, 40, 0.4);
            padding: clamp(30px, 5vw, 60px) clamp(20px, 4vw, 50px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(138, 43, 226, 0.15) inset;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(162, 59, 255, 0.2);
            width: 100%;
            max-width: 500px;
            animation: floatIn 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .icon {
            font-size: clamp(50px, 10vw, 80px);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(162, 59, 255, 0.6));
            animation: pulse 2s infinite alternate;
        }

        h1 {
            font-size: clamp(60px, 15vw, 110px);
            margin: 0;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1;
            background: linear-gradient(135deg, #e089ff, #9b00e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(155, 0, 232, 0.4));
        }

        h2 {
            font-size: clamp(20px, 5vw, 28px);
            margin: 10px 0 20px;
            font-weight: 600;
            color: #d896ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: clamp(14px, 3.5vw, 16px);
            margin-bottom: 10px;
            line-height: 1.6;
            color: #a894c2;
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(162, 59, 255, 0.4)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(162, 59, 255, 0.8)); }
        }

        @media (max-width: 350px) {
            .container {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🔒</div>
        <h1>403</h1>
        <h2>Acesso Restrito</h2>
        <p>Você encontrou um bloqueio de segurança. Suas credenciais não têm permissão para explorar esta área.</p>
    </div>

</body>
</html>
